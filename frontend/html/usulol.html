<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>
    <link rel="stylesheet" href="../css/principal.css">
</head>
<body>
    <div class="login-container">
    <form action="">
        <h2>Iniciar Sesión</h2>
        <label for="usu">Ingrese su Usuario:</label>
        <input type="text" name="usu" id="usu">
        <br><br>
        <label for="contr">Ingrese su contraseña:</label>
        <input type="password" name="contr" id="contr">
        <br><br>
        <button type="button" onclick="Poner()"><strong>Iniciar Sesion</strong></button>
        <br><br>
        <button type="button" onclick="window.location.href='registro.html'"><strong>Registrarse como nuevo usuario</strong></button>
        </div>

    <script>
        async function Poner() {
            const usuario = document.getElementById("usu").value;
            const contraseña = document.getElementById("contr").value;

            try {
                const respuesta = await fetch("http://localhost:3001/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombre: usuario,
                        contraseña: contraseña
                    })
                });

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    alert(resultado.mensaje || "No se pudo iniciar sesión");
                    return;
                }

                localStorage.setItem("persona", JSON.stringify(resultado.persona));
                localStorage.setItem("rol", resultado.rol);
                localStorage.removeItem("id_paciente");
                localStorage.removeItem("id_profesional");

                if (resultado.rol === "Administrador") {
                    window.location.href = "admin.html";
                } else if (resultado.rol === "Profesional") {
                    const respuestaProfesional = await fetch(
                        "http://localhost:3001/profesional/persona/" +
                        resultado.persona.id_persona
                    );
                    const profesional = await respuestaProfesional.json();

                    if (!respuestaProfesional.ok) {
                        alert(profesional.mensaje || "No se encontró el profesional");
                        return;
                    }

                    localStorage.setItem(
                        "id_profesional",
                        profesional.id_profesional
                    );
                    window.location.href = "profesor.html";
                } else if (resultado.rol === "Paciente") {
                    if (!resultado.id_paciente) {
                        alert("La cuenta no tiene un paciente asociado");
                        return;
                    }

                    localStorage.setItem("id_paciente", resultado.id_paciente);
                    window.location.href = "alumno.html";
                } else if (resultado.rol === "Supervisor") {
                    alert("La página de supervisor todavía no está disponible");
                }
            } catch (error) {
                console.error(error);
                alert("Error al conectar con el servidor");
            }
        }
    </script>
    </form>
</body>

</html>
