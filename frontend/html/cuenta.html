<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear cuenta</title><link rel="stylesheet" href="../css/registo.css"><style>
/* Se conserva el tamaño y distribución original de principal.css / registo.css. */
.login-container { max-width: calc(100vw - 28px); }
.login-container input, .login-container select { max-width: 100%; }
.login-container button:disabled { opacity: .55; cursor: wait; transform: none; }
.mensaje-app { padding: 12px 14px; border-radius: 10px; margin: 12px 0; font-weight: 600; line-height: 1.45; background: #15233b; color: #e2e8f0; border: 1px solid #64748b; overflow-wrap: anywhere; }
.mensaje-app[hidden] { display: none; }
.mensaje-app.error { background: #4c1d24; color: #fecaca; border-color: #ef4444; }
.mensaje-app.ok { background: #12382b; color: #bbf7d0; border-color: #22c55e; }
.mensaje-app.info { background: #172d52; color: #bfdbfe; border-color: #60a5fa; }
.enlace-form { text-align: center; display: block; color: #dbeafe; margin-top: 12px; }
/* El bloque de profesional sigue oculto hasta que se selecciona su rol. */
#datos-profesional[hidden] { display:none; }
#datos-profesional label { color: white; }
#datos-profesional select { padding: 9px; border-radius: 8px; }
</style></head><body><div class="login-container"><form id="form-cuenta"><h2>Crear cuenta</h2><p style="color:#e2e8f0;text-align:center">Ingresá tus datos de acceso</p><label for="usuario">Usuario</label><input id="usuario" autocomplete="username" required><label for="contrasena">Contraseña</label><input type="password" id="contrasena" autocomplete="new-password" minlength="8" required><label for="confirmar">Repetí la contraseña</label><input type="password" id="confirmar" autocomplete="new-password" required><label for="rol">Tipo de usuario</label><select id="rol"><option value="2">Paciente</option><option value="3">Profesional (solo pruebas; requiere validación administrativa)</option></select><div id="datos-profesional" hidden><label for="matricula">Matrícula</label><input id="matricula"><label for="especialidad">Especialidad</label><select id="especialidad"></select></div><button type="submit" id="boton-crear">Registrarse</button><div id="mensaje-app" class="mensaje-app" role="status" aria-live="polite" hidden></div><a class="enlace-form" href="registro.html">Volver a datos personales</a></form></div><script>
const API='http://localhost:3001';
function mensaje(texto, tipo='info') {const el=document.getElementById('mensaje-app');el.textContent=texto;el.className='mensaje-app '+tipo;el.hidden=false;}
async function leerJSON(respuesta) {const texto=await respuesta.text();try{return texto?JSON.parse(texto):{};}catch{throw new Error('El servidor no devolvió JSON. Revisá que el backend esté activo y la ruta exista.');}}
const rol=document.getElementById('rol');const bloque=document.getElementById('datos-profesional');rol.addEventListener('change',()=>{bloque.hidden=rol.value!=='3';document.getElementById('matricula').required=rol.value==='3';document.getElementById('especialidad').required=rol.value==='3';});
async function cargarEspecialidades(){try{const r=await fetch(API+'/especialidades');const lista=await leerJSON(r);if(!r.ok)throw new Error(lista.mensaje||'No se cargaron las especialidades.');const select=document.getElementById('especialidad');select.replaceChildren();for(const esp of lista){const opt=document.createElement('option');opt.value=esp.id_especialidad;opt.textContent=esp.nombre;select.appendChild(opt);}}catch(err){console.error(err);mensaje('No se pudieron cargar las especialidades: '+err.message,'error');}}cargarEspecialidades();
document.getElementById('form-cuenta').addEventListener('submit',async e=>{e.preventDefault();const boton=document.getElementById('boton-crear');const usuario=document.getElementById('usuario').value.trim();const contraseña=document.getElementById('contrasena').value;const confirmar=document.getElementById('confirmar').value;const id_persona=Number(localStorage.getItem('id_persona'));if(!Number.isInteger(id_persona)||id_persona<=0){mensaje('No se encontró la persona registrada. Volvé al paso anterior.','error');return;}if(contraseña!==confirmar){mensaje('Las contraseñas no coinciden.','error');return;}if(contraseña.length<8){mensaje('La contraseña debe tener al menos 8 caracteres.','error');return;}if(rol.value==='3'&&(!document.getElementById('matricula').value.trim()||!document.getElementById('especialidad').value)){mensaje('Completá matrícula y especialidad.','error');return;}
boton.disabled=true;mensaje('Creando cuenta...');try{const r=await fetch(API+'/usuarios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_persona,nombre:usuario,contraseña,id_rol:Number(rol.value)})});const u=await leerJSON(r);if(!r.ok)throw new Error(u.mensaje||'No se pudo crear la cuenta.');if(rol.value==='3'){const rp=await fetch(API+'/profesional',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_persona,matricula:document.getElementById('matricula').value.trim(),id_especialidad:Number(document.getElementById('especialidad').value)})});const p=await leerJSON(rp);if(!rp.ok)throw new Error('La cuenta se creó, pero no se pudo completar el perfil profesional: '+(p.mensaje||'Error del servidor')+'. No repitas el registro sin revisar los datos.');}
localStorage.removeItem('id_persona');mensaje('✅ Cuenta creada correctamente. Volviendo al inicio de sesión...','ok');setTimeout(()=>{window.location.replace('usulol.html');},1100);}catch(err){console.error(err);mensaje(err.message||'No se pudo crear la cuenta.','error');}finally{boton.disabled=false;}});
</script></body></html>
