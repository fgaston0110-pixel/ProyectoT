<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>

    <link rel="stylesheet" href="../css/registo.css">
</head>

<body>

    <div class="login-container">

        <form>

            <h2>Crear cuenta</h2>

            <p>Ingrese sus datos de acceso</p>

            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario">

            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña">

            <label for="confirmar">Repita la contraseña:</label>
            <input type="password" id="confirmar">

            <label for="rol">Tipo de usuario:</label>

            <select id="rol">
                <option value="2">Paciente</option>
                <option value="3">Profesional</option>
            </select>

            <div id="datos-profesional" style="display:none;">

                <label for="matricula">
                    Matrícula
                </label>

                <input
                    type="text"
                    id="matricula"
                >

                <label for="especialidad">
                    Especialidad
                </label>

                <select id="especialidad">

                </select>

            </div>

            <br>

            <button type="button" onclick="CrearCuenta()">
                <strong>Registrarse</strong>
            </button>

        </form>

    </div>

    <script>

        document
            .getElementById("rol")
            .addEventListener(
                "change",
                function () {

                    const bloque =
                        document.getElementById(
                            "datos-profesional"
                        );

                    if (this.value == "3") {

                        bloque.style.display =
                            "block";

                    } else {

                        bloque.style.display =
                            "none";
                    }

                }
            );

        async function cargarEspecialidades() {

            try {

                const respuesta =
                    await fetch(
                        "http://localhost:3001/especialidades"
                    );

                const especialidades =
                    await respuesta.json();

                const select =
                    document.getElementById(
                        "especialidad"
                    );

                select.innerHTML = "";

                especialidades.forEach(
                    especialidad => {

                        select.innerHTML += `
                            <option value="${especialidad.id_especialidad}">
                                ${especialidad.nombre}
                            </option>
                        `;

                    }
                );

            } catch (error) {

                console.log(error);

            }

        }

        cargarEspecialidades();

        async function CrearCuenta() {

            const usuario =
                document.getElementById(
                    "usuario"
                ).value;

            const contraseña =
                document.getElementById(
                    "contraseña"
                ).value;

            const confirmar =
                document.getElementById(
                    "confirmar"
                ).value;

            const rol =
                document.getElementById(
                    "rol"
                ).value;

            if (contraseña !== confirmar) {

                alert(
                    "Las contraseñas no coinciden"
                );

                return;
            }

            const id_persona =
                localStorage.getItem(
                    "id_persona"
                );

            if (!id_persona) {

                alert(
                    "No se encontró la persona registrada"
                );

                return;
            }

            try {

                const respuestaUsuario =
                    await fetch(
                        "http://localhost:3001/usuarios",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                id_persona:
                                    parseInt(id_persona),

                                nombre:
                                    usuario,

                                contraseña:
                                    contraseña,

                                id_rol:
                                    parseInt(rol)

                            })
                        }
                    );

                const resultadoUsuario =
                    await respuestaUsuario.json();

                if (!respuestaUsuario.ok) {

                    alert(
                        resultadoUsuario.mensaje
                    );

                    return;
                }

                if (rol == "3") {

                    const matricula =
                        document.getElementById(
                            "matricula"
                        ).value;

                    const idEspecialidad =
                        document.getElementById(
                            "especialidad"
                        ).value;

                    const respuestaProfesional =
                        await fetch(
                            "http://localhost:3001/profesional",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    id_persona:
                                        parseInt(
                                            id_persona
                                        ),

                                    matricula:
                                        matricula,

                                    id_especialidad:
                                        parseInt(
                                            idEspecialidad
                                        )

                                })

                            }
                        );

                    const resultadoProfesional =
                        await respuestaProfesional.json();

                    if (!respuestaProfesional.ok) {

                        alert(
                            resultadoProfesional.mensaje
                        );

                        return;
                    }

                }

                alert(
                    "Cuenta creada correctamente"
                );

                localStorage.removeItem(
                    "id_persona"
                );

                window.location.replace(
                    "./usulol.html"
                );

            }
            catch (error) {

                console.log(error);

                alert(
                    "Error al conectar con el servidor"
                );

            }

        }

    </script>

</body>

</html>
