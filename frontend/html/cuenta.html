<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>

    <link rel="stylesheet" href="../css/registo.css">
</head>

<body>

    <div class="login-container">

        <form>

            <h2>Crear cuenta</h2>

            <p>Ingrese sus datos de acceso</p>

            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario">

            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña">

            <label for="confirmar">Repita la contraseña:</label>
            <input type="password" id="confirmar">

            <button type="button" onclick="CrearCuenta()">
                <strong>Registrarse</strong>
            </button>

        </form>

    </div>


    <script>

        async function CrearCuenta() {

            const usuario = document.getElementById("usuario").value;
            const contraseña = document.getElementById("contraseña").value;
            const confirmar = document.getElementById("confirmar").value;

            // Comprobamos que las contraseñas coincidan
            if (contraseña !== confirmar) {

                alert("Las contraseñas no coinciden");
                return;

            }

            // Recuperamos el id de la persona registrada anteriormente
            const id_persona = localStorage.getItem("id_persona");

            // Comprobamos que exista
            if (!id_persona) {

                alert("No se encontró la persona registrada");
                return;

            }

            const datos = {

                id_persona: id_persona,
                nombre: usuario,
                contraseña: contraseña,
                id_rol: 2

            };


            try {

                const respuesta = await fetch("http://localhost:3001/usuarios", {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify(datos)

                });


                const resultado = await respuesta.json();

                console.log(resultado);


                if (respuesta.ok) {

                    alert("Cuenta creada correctamente");

                    // Eliminamos el id guardado porque ya no lo necesitamos
                    localStorage.removeItem("id_persona");

                    // Volvemos al login
                    window.location.href = "usulol.html";

                } else {

                    alert(resultado.mensaje);

                }


            } catch (error) {

                console.log(error);

                alert("Error al conectar con el servidor");

            }

        }

    </script>

</body>

</html>
