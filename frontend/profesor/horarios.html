<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis horarios</title>
    <link rel="stylesheet" href="../css/paciente.css">
    <style>
        .principal > h1,
        .seccion-horarios h2 {
            color: #60a5fa;
        }

        .seccion-horarios {
            margin-top: 24px;
            padding: 24px;
            border: 1px solid #334155;
            border-radius: 15px;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .formulario-horario {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            align-items: end;
            gap: 16px;
            margin-top: 18px;
        }

        .campo-horario {
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: #cbd5e1;
        }

        .campo-horario select,
        .campo-horario input {
            width: 100%;
            padding: 11px;
            border: 1px solid #64748b;
            border-radius: 8px;
            background: #f8fafc;
            color: #0f172a;
            font: inherit;
        }

        .formulario-horario button {
            min-height: 43px;
            padding: 11px 16px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .formulario-horario button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #mensaje {
            min-height: 24px;
            margin-top: 14px;
            color: #cbd5e1;
        }

        .lista-horarios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .horario {
            padding: 18px;
            border: 1px solid #64748b;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.8);
        }

        .horario h3 {
            margin-bottom: 8px;
            color: #60a5fa;
        }

        .horario p {
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <main class="principal">
        <h1>Mis horarios</h1>
        <p>Agregá los días y rangos horarios en los que atendés.</p>

        <section class="seccion-horarios">
            <h2>Cargar un horario</h2>
            <form id="formulario-horario" class="formulario-horario">
                <label class="campo-horario" for="dia">
                    Día
                    <select id="dia" name="dia" required>
                        <option value="">Seleccioná un día</option>
                        <option value="Lunes">Lunes</option>
                        <option value="Martes">Martes</option>
                        <option value="Miércoles">Miércoles</option>
                        <option value="Jueves">Jueves</option>
                        <option value="Viernes">Viernes</option>
                        <option value="Sábado">Sábado</option>
                        <option value="Domingo">Domingo</option>
                    </select>
                </label>

                <label class="campo-horario" for="hora-inicio">
                    Hora de inicio
                    <input id="hora-inicio" name="hora_inicio" type="time" required>
                </label>

                <label class="campo-horario" for="hora-fin">
                    Hora de fin
                    <input id="hora-fin" name="hora_fin" type="time" required>
                </label>

                <button id="guardar-horario" type="submit">Guardar horario</button>
            </form>
            <p id="mensaje" role="status"></p>
        </section>

        <section class="seccion-horarios">
            <h2>Horarios cargados</h2>
            <div id="lista-horarios" class="lista-horarios">
                <p>Cargando horarios...</p>
            </div>
        </section>
    </main>

    <script>
        const API = "http://localhost:3001";
        const idProfesional = localStorage.getItem("id_profesional");
        const formulario = document.getElementById("formulario-horario");
        const mensaje = document.getElementById("mensaje");
        const listaHorarios = document.getElementById("lista-horarios");
        const botonGuardar = document.getElementById("guardar-horario");

        function mostrarHorarios(horarios) {
            listaHorarios.replaceChildren();

            if (horarios.length === 0) {
                const vacio = document.createElement("p");
                vacio.textContent = "Todavía no cargaste horarios.";
                listaHorarios.appendChild(vacio);
                return;
            }

            horarios.forEach((horario) => {
                const tarjeta = document.createElement("article");
                tarjeta.className = "horario";

                const dia = document.createElement("h3");
                dia.textContent = horario.dia;

                const rango = document.createElement("p");
                rango.textContent =
                    `${horario.hora_inicio.slice(0, 5)} a ${horario.hora_fin.slice(0, 5)}`;

                tarjeta.append(dia, rango);
                listaHorarios.appendChild(tarjeta);
            });
        }

        async function cargarHorarios() {
            if (!idProfesional) {
                mensaje.textContent = "No se encontró el profesional. Inicia sesión nuevamente.";
                listaHorarios.replaceChildren();
                return;
            }

            try {
                const respuesta = await fetch(
                    `${API}/horario/profesional/${encodeURIComponent(idProfesional)}`
                );
                const horarios = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(horarios.mensaje || "No se pudieron cargar los horarios");
                }

                mostrarHorarios(horarios);
            } catch (error) {
                console.error("Error al cargar los horarios:", error);
                listaHorarios.replaceChildren();
                mensaje.textContent =
                    error.message || "No se pudieron cargar los horarios.";
            }
        }

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();
            mensaje.textContent = "";

            if (!idProfesional) {
                mensaje.textContent = "No se encontró el profesional. Inicia sesión nuevamente.";
                return;
            }

            const horaInicio = document.getElementById("hora-inicio").value;
            const horaFin = document.getElementById("hora-fin").value;

            if (horaInicio >= horaFin) {
                mensaje.textContent = "La hora de fin debe ser posterior a la de inicio.";
                return;
            }

            botonGuardar.disabled = true;

            try {
                const respuesta = await fetch(`${API}/horario`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id_profesional: Number(idProfesional),
                        dia: document.getElementById("dia").value,
                        hora_inicio: horaInicio,
                        hora_fin: horaFin
                    })
                });
                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    mensaje.textContent =
                        resultado.mensaje || "No se pudo guardar el horario.";
                    return;
                }

                formulario.reset();
                mensaje.textContent = "Horario guardado correctamente.";
                await cargarHorarios();
            } catch (error) {
                console.error("Error al guardar el horario:", error);
                mensaje.textContent = "No se pudo conectar con el servidor.";
            } finally {
                botonGuardar.disabled = false;
            }
        });

        cargarHorarios();
    </script>
</body>
</html>
