<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Turnos</title>

    <link rel="stylesheet" href="../css/estilo2.css">
</head>

<body>

    <main>

        <h1>Mis Turnos</h1>

        <div id="mis-turnos" class="turnos"></div>

    </main>

    <script>

        async function cargarMisTurnos() {

            const idPaciente =
                localStorage.getItem("id_paciente");

            if (!idPaciente) {

                alert("No se encontró el paciente");

                return;
            }

            try {

                const respuesta =
                    await fetch(
                        `http://localhost:3001/turnos/paciente/${idPaciente}`
                    );

                if (!respuesta.ok) {
                    throw new Error("No se pudieron cargar los turnos");
                }

                const turnos =
                    await respuesta.json();

                const contenedor =
                    document.getElementById(
                        "mis-turnos"
                    );

                contenedor.innerHTML = "";

                if (turnos.length === 0) {

                    contenedor.innerHTML = `
                        <p>No tenés turnos reservados.</p>
                    `;

                    return;
                }

                turnos.forEach(turno => {

                    const fecha =
                        new Date(
                            turno.fecha_turno
                        );

                    contenedor.innerHTML += `

                       <div class="turno">

    <h2>
        Turno #${turno.id_turno}
    </h2>

    <p>
        Fecha:
        ${fecha.toLocaleDateString()}
    </p>

    <p>
        Hora:
        ${fecha.toLocaleTimeString()}
    </p>

    <p>
        Día:
        ${turno.Horario.dia}
    </p>

    <button
        class="btn-cancelar mostrar"
        onclick="cancelarTurno(${turno.id_turno})"
    >
        Cancelar turno
    </button>

</div>

                    `;
                });

            } catch (error) {

                console.error(error);

                alert(
                    "Error al cargar los turnos"
                );
            }

        }

        cargarMisTurnos();

        async function cancelarTurno(idTurno) {

    const confirmar =
        confirm(
            "¿Desea cancelar este turno?"
        );

    if (!confirmar) {

        return;
    }

    try {

        const respuesta =
            await fetch(
                `http://localhost:3001/turnos/${idTurno}?id_paciente=${
                    encodeURIComponent(localStorage.getItem("id_paciente"))
                }`,
                {
                    method: "DELETE"
                }
            );

        const datos =
            await respuesta.json();

        if (!respuesta.ok) {

            alert(datos.mensaje);

            return;
        }

        alert(
            "Turno cancelado correctamente"
        );

        cargarMisTurnos();

    } catch (error) {

        console.error(error);

        alert(
            "Error al cancelar el turno"
        );
    }
}

    </script>

</body>

</html>
