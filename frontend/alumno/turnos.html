<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos</title>

    <link rel="stylesheet" href="../css/estilo2.css">
</head>

<body>

    <main>

        <h1>Turnos disponibles</h1>

        <div id="lista-turnos" class="turnos"></div>

    </main>

    <script>

        async function cargarHorarios() {

            const idProfesional =
                localStorage.getItem("id_profesional");

            if (!idProfesional) {

                alert("No se encontró el profesional seleccionado");

                return;
            }

            try {

                const respuesta =
                    await fetch(
                        "http://localhost:3001/horario"
                    );

                const horarios =
                    await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error("No se pudieron cargar los horarios");
                }

                const horariosFiltrados =
                    horarios.filter(
                        horario =>
                        horario.id_profesional == idProfesional &&
                        horario.disponible
                    );

                const contenedor =
                    document.getElementById(
                        "lista-turnos"
                    );

                contenedor.innerHTML = "";

                if (horariosFiltrados.length === 0) {

                    contenedor.innerHTML =
                        "<p>No hay horarios disponibles.</p>";

                    return;
                }

                horariosFiltrados.forEach(
                    horario => {

                        contenedor.innerHTML += `

                        <div class="turno">

                            <h2>${horario.dia}</h2>

                            <p>
                                ${horario.hora_inicio}
                                -
                                ${horario.hora_fin}
                            </p>

                            <input
                                type="datetime-local"
                                id="fecha-${horario.id_horario}"
                                step="1800"
                            >

                            <br><br>

                            <button
                                class="btn-turno"
                                onclick="reservarTurno(${horario.id_horario})"
                            >
                                Reservar
                            </button>

                        </div>

                        `;
                    }
                );

            } catch (error) {

                console.error(error);

                alert(
                    "Error al cargar los horarios"
                );
            }
        }

        async function reservarTurno(idHorario) {

            const idPaciente =
                localStorage.getItem(
                    "id_paciente"
                );

            if (!idPaciente) {

                alert(
                    "No se encontró el paciente"
                );

                return;
            }

            const fechaTurno =
                document.getElementById(
                    `fecha-${idHorario}`
                ).value;

            if (!fechaTurno) {

                alert(
                    "Seleccione una fecha y hora"
                );

                return;
            }

            try {

                const respuesta =
                    await fetch(
                        "http://localhost:3001/turnos",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                id_paciente:
                                    parseInt(idPaciente),

                                id_horario:
                                    parseInt(idHorario),

                                fecha_turno:
                                    fechaTurno

                            })
                        }
                    );

                const datos =
                    await respuesta.json();

                if (!respuesta.ok) {

                    alert(
                        datos.mensaje
                    );

                    return;
                }

                alert(
                    "✅ Turno reservado correctamente"
                );

            } catch (error) {

                console.error(error);

                alert(
                    "Error al reservar el turno"
                );
            }
        }

        cargarHorarios();

    </script>

</body>

</html>
